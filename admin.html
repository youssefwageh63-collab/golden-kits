<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة GOLDEN KITS</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">GK</span><span>GOLDEN <b>KITS</b><small>لوحة الإدارة</small></span></a><a href="index.html">العودة للمتجر ←</a></header><main class="section"><p class="eyebrow">STORE CONTROL</p><h1>لوحة <em>الإدارة</em></h1><p class="muted">النسخة التجريبية تحفظ المنتجات والطلبات على نفس الجهاز. اربط قاعدة البيانات قبل استقبال طلبات حقيقية.</p><div class="promo"><div><h2 id="orderCount">0 طلب</h2><p>الطلبات المسجلة على هذا الجهاز</p></div><button class="gold-btn" id="refresh">تحديث</button></div><h2>الطلبات</h2><div id="orders"></div><h2 style="margin-top:50px">إضافة منتج</h2><form id="addProduct" style="max-width:520px"><label>اسم المنتج<input name="name" required></label><label>القسم<select name="category"><option>أندية</option><option>منتخبات</option><option>أحذية</option><option>إكسسوارات</option></select></label><label>السعر بالجنيه<input name="price" type="number" min="1" required></label><label>نوع العرض<select name="type"><option value="shirt">طقم</option><option value="shoe">حذاء</option><option value="ball">كرة</option><option value="sock">شراب</option></select></label><button class="gold-btn">إضافة المنتج</button><p id="adminMsg" class="form-message"></p></form><h2 style="margin-top:45px">المنتجات الحالية</h2><div id="adminProducts"></div></main><script src="config.js"></script><script>
function adminRender(){let orders=JSON.parse(localStorage.getItem("gk_orders")||"[]");document.querySelector("#orderCount").textContent=orders.length+" طلب";document.querySelector("#orders").innerHTML=orders.length?orders.map(o=>`<div class="product" style="padding:16px;margin:10px 0"><b>طلب #${o.id}</b> — ${o.customer_name} — ${o.phone}<p>${o.area}، ${o.address}</p><p>${o.items.map(i=>i.name+" × "+i.quantity).join("، ")}</p><strong class="price">${Number(o.total).toLocaleString("ar-EG")} ج.م</strong><small style="display:block">${o.payment_method} | ${o.status}</small></div>`).join(""):"<p class='empty'>لا توجد طلبات محفوظة على هذا الجهاز.</p>";let ps=JSON.parse(localStorage.getItem("gk_products")||"null")||[];document.querySelector("#adminProducts").innerHTML=ps.map(p=>`<div class="cart-row"><span>${p.name} — ${p.category}</span><b>${p.price} ج.م</b></div>`).join("");}
document.querySelector("#refresh").onclick=adminRender;document.querySelector("#addProduct").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),ps=JSON.parse(localStorage.getItem("gk_products")||"null")||[];ps.push({id:Date.now(),name:f.get("name"),category:f.get("category"),price:Number(f.get("price")),type:f.get("type"),tag:"جديد"});localStorage.setItem("gk_products",JSON.stringify(ps));document.querySelector("#adminMsg").textContent="تمت إضافة المنتج على هذا الجهاز.";e.target.reset();adminRender();};adminRender();
</script></body></html>
